name: Fix slow-moving description merge
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fix-slow-description-merge.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prevent cross-item description merging in Slow Moving
        shell: python
        run: |
          from pathlib import Path
          p = Path('js/app.js')
          s = p.read_text()
          old = "const continuation=fixDescription(columnValue(row,ranges,'desc'));"
          assert s.count(old) == 1, 'Continuation logic changed; refusing unsafe patch'
          s = s.replace(old, "const continuation=fixDescription(columnValue(row,ranges,'desc'));if(kind==='slow'){const numeric=columnNumber(row,ranges,'stock')||columnNumber(row,ranges,'rate')||columnNumber(row,ranges,'value');if(!numeric&&continuation)continuations.push({y:row._y,text:continuation});continue;}", 1)
          p.write_text(s)
          p = Path('index.html')
          s = p.read_text()
          old = 'js/app.js?v=exclude-fg-1'
          assert s.count(old) == 1, 'Entry point changed; refusing unsafe patch'
          p.write_text(s.replace(old, 'js/app.js?v=slow-desc-1', 1))
      - name: Check JavaScript syntax
        run: node --check js/app.js
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/app.js index.html
          git diff --cached --quiet || (git commit -m 'Prevent cross-item description merging in slow moving imports' && git push)
